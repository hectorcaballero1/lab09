services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: labofwords
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${PGPORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d labofwords"]
      interval: 2s
      timeout: 3s
      retries: 15
